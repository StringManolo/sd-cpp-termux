name: Build for Termux (Android)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create new release"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - master
      - termux
    paths:
      - ".github/workflows/build-termux.yml"
      - "**/CMakeLists.txt"
      - "**/*.h"
      - "**/*.hpp"
      - "**/*.c"
      - "**/*.cpp"
      - "ggml"

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-termux-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d

      - name: Configurar CMake con toolchain de Android
        run: |
          cmake -B build-android \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DSD_BUILD_EXAMPLES=ON \
            -DSD_BUILD_SHARED_LIBS=OFF \
            -DSD_SERVER_BUILD_FRONTEND=OFF \
            -DGGML_NATIVE=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static-openmp"

      - name: Compilar
        run: cmake --build build-android --config Release -j$(nproc)

      - name: Verificar dependencias del binario
        run: |
          SD_BIN=$(find build-android/bin -maxdepth 1 -name "sd-cli" -o -name "sd" | head -n 1)
          echo "Binario: $SD_BIN"
          readelf -d "$SD_BIN" | grep NEEDED || true

      - name: Obtener hash del commit (para releases)
        id: commit
        if: ${{ github.event_name == 'push' || github.event.inputs.create_release == 'true' }}
        shell: bash
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Empaquetar artefactos (binario + licencias)
        if: ${{ github.event_name == 'push' || github.event.inputs.create_release == 'true' }}
        run: |
          mkdir -p artifact-termux
          cp build-android/bin/sd-cli artifact-termux/ 2>/dev/null || cp build-android/bin/sd artifact-termux/
          cp ggml/LICENSE artifact-termux/ggml.txt 2>/dev/null || true
          cp LICENSE artifact-termux/stable-diffusion.cpp.txt 2>/dev/null || true
          cd artifact-termux && zip -r ../sd-termux-arm64.zip . && cd ..

      - name: Subir artefacto del binario
        uses: actions/upload-artifact@v4
        with:
          name: sd-termux-arm64
          path: sd-termux-arm64.zip
          if-no-files-found: error

      - name: Extraer y subir libomp.so del NDK (respaldo)
        run: |
          LIBOMP_PATH=$(find "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64" -path "*/lib/linux/aarch64/libomp.so" | head -n 1)
          if [ -z "$LIBOMP_PATH" ]; then
            echo "No se encontró libomp.so para arm64 en el NDK"
            exit 1
          fi
          echo "Encontrado: $LIBOMP_PATH"
          mkdir -p libomp-artifact
          cp "$LIBOMP_PATH" libomp-artifact/

      - name: Subir libomp.so como artefacto de respaldo
        uses: actions/upload-artifact@v4
        with:
          name: libomp-termux-arm64
          path: libomp-artifact/libomp.so
          if-no-files-found: error

      - name: Crear Release en GitHub (opcional)
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: termux-${{ steps.commit.outputs.short }}
          name: Termux Build ${{ steps.commit.outputs.short }}
          draft: false
          prerelease: false
          files: |
            sd-termux-arm64.zip
            libomp-artifact/libomp.so
